name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-lock.txt
      # synthetic match only -- the real match data is never in this repository
      - run: python -m tests.test_pipeline
      - name: guard against committed match data
        run: |
          if git ls-files | grep -E '^data/(tactical|broadcast|cache)/|\.(mp4|npz)$'; then
            echo "match data must not be committed"; exit 1
          fi
      - run: python evaluation/run_evaluation.py --no-detail
